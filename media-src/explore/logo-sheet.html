<!doctype html><meta charset="utf-8"><title>bDojoX logo directions A-F</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Shippori+Mincho:wght@800&family=Chakra+Petch:wght@600;700&family=Syne:wght@800&family=Sora:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500&display=swap">
<style>
:root{--red:#e0262f;--blue:#3a6bf0;--ink:#efece3;--navy:#07090f}
*{box-sizing:border-box}body{margin:0;width:2400px;background:#04050a;color:var(--ink);font:14px/1.4 'IBM Plex Sans',sans-serif;padding:48px}
h1{font:600 22px 'IBM Plex Sans Condensed';letter-spacing:.2em;text-transform:uppercase;margin:0 0 6px}p.sub{margin:0 0 32px;color:#8a8c9b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cell{background:#090c15;border:1px solid #232838;padding:22px;position:relative}
.tag{display:flex;gap:14px;align-items:baseline;margin-bottom:16px}.tag b{font:800 44px/1 'Archivo';color:#ffd400}.tag span{font:500 16px 'IBM Plex Sans Condensed';letter-spacing:.14em;text-transform:uppercase}.tag i{font-style:normal;color:#8a8c9b;font-size:13px;margin-left:auto;max-width:520px;text-align:right}
.nav{height:84px;background:var(--navy);border:1px solid rgba(239,236,227,.2);display:flex;align-items:center;padding:0 22px;gap:28px}
.nav .lk{display:flex;gap:26px;margin:0 auto;font:500 11px 'IBM Plex Sans Condensed';letter-spacing:.16em;text-transform:uppercase;color:#a9abb8}
.nav .cta{background:#c8141c;color:#fff;font:600 11px 'IBM Plex Sans Condensed';letter-spacing:.14em;text-transform:uppercase;padding:13px 18px}
.row{display:grid;grid-template-columns:1fr 250px;gap:16px;margin-top:16px}
.big{height:400px;background:radial-gradient(90% 80% at 50% 40%,#14204a 0%,#090d1c 60%,#05060c 100%);border:1px solid #1b2133;display:grid;place-items:center;overflow:hidden}
.fav{display:grid;gap:12px;align-content:start}.fav div{display:flex;gap:14px;align-items:flex-end;padding:14px;background:#05060c;border:1px solid #1b2133}.fav .lt{background:#efece3}.fav small{font:500 10px 'IBM Plex Sans Condensed';letter-spacing:.14em;text-transform:uppercase;color:#8a8c9b;display:block;width:100%;margin-bottom:-4px}.fav .lt small{color:#555}
.fav div{flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:14px}
</style>
<h1>bDojoX - logo directions</h1><p class="sub">Six different ideas. Each: nav lockup on the real nav, large mark, favicon (16 / 32 / 64 + on light).</p>
<div class="grid" id="g"></div>
<script>
const R='#e0262f',B='#3a6bf0',N='#07090f';let I='#efece3';
const NAVLINKS='<div class="lk"><span>The dojo</span><span>Five belts</span><span>Join</span><span>Status</span></div><div class="cta">Get bWalletX &rarr;</div>';
// ---------- A: 3D torii (render) + simplified flat svg for small sizes
const A_img=(h)=>`<svg height="${h}" viewBox="600 340 1380 1250" style="display:block"><image href="out/torii3d-mark.png" width="2400" height="2000"/></svg>`;
const A_flat=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><defs><linearGradient id="ag${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a60"/><stop offset="1" stop-color="#c8141c"/></linearGradient></defs><path d="M2 9Q32 21 62 7L59 17Q32 29 5 18Z" fill="url(#ag${s})"/><path d="M8 21Q32 30 56 20V25Q32 34 8 25Z" fill="#101a44"/><rect x="14" y="27" width="7.5" height="35" fill="#e0262f"/><rect x="42.5" y="27" width="7.5" height="35" fill="#e0262f"/><rect x="9" y="35" width="46" height="5.5" fill="${B}"/><rect x="29" y="29" width="6" height="7" fill="${B}"/></svg>`;
const A_word=(fs)=>`<span style="font:800 ${fs}px/1 Archivo;font-stretch:125%;font-variation-settings:'wdth' 125;letter-spacing:.02em;color:${I}">BDOJO<span style="color:${R}">X</span></span>`;
// ---------- B: ensō + hanko
function ensoPath(){let s=7,rnd=()=>(s=(s*16807)%2147483647)/2147483647;const cx=100,cy=100,R0=70,n=140,out=[],inn=[];let j=0;
 for(let i=0;i<=n;i++){const t=i/n,th=(-48+336*t)*Math.PI/180;const w=t<.08?4+t/.08*20:t<.7?24+Math.sin(t*9)*2:24*Math.max(0,1-(t-.7)/.3)**1.1+2.5;j+=(rnd()-.5)*.5;j*=.9;const r=R0-t*10+Math.sin(t*5)*1.6+j;
  out.push([cx+(r+w/2)*Math.cos(th),cy+(r+w/2)*Math.sin(th)]);inn.push([cx+(r-w/2)*Math.cos(th),cy+(r-w/2)*Math.sin(th)])}
 return 'M'+out.concat(inn.reverse()).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z'}
const EP=ensoPath();
const B_mark=(s,full=true,col=I)=>`<svg width="${s}" height="${s}" viewBox="0 0 200 200"><defs><filter id="rg${s}${full}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="${full?5:3}"/></filter><mask id="km${s}${full}"><rect width="200" height="200" fill="#fff"/><text x="141" y="${full?160:163}" text-anchor="middle" font-family="Shippori Mincho" font-weight="800" font-size="${full?44:46}" fill="#000" transform="rotate(-5 141 141)">道</text></mask></defs>
${full?`<path d="${EP}" fill="${col}" filter="url(#rg${s}${full})"/><g stroke="${N}" stroke-opacity=".75" fill="none" stroke-width=".9">${[0,1,2,3,4].map(k=>`<path d="M${100+(62-k*3)*Math.cos(2.3+k*.3)} ${100+(62-k*3)*Math.sin(2.3+k*.3)}A${62-k*3} ${62-k*3} 0 0 0 ${100+(62-k*3)*Math.cos(3.4+k*.25)} ${100+(62-k*3)*Math.sin(3.4+k*.25)}`).join('"/><path d="')}"/></g>`:''}
<g filter="url(#rg${s}${full})"><rect x="${full?112:20}" y="${full?112:20}" width="${full?56:160}" height="${full?56:160}" rx="${full?3:8}" fill="${R}" mask="url(#km${s}${full})" transform="${full?'rotate(-5 141 141)':''}"/></g></svg>`;
const B_fav=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 200 200"><rect x="14" y="14" width="172" height="172" rx="14" fill="${R}"/><text x="100" y="152" text-anchor="middle" font-family="Shippori Mincho" font-weight="800" font-size="140" fill="${N}">道</text></svg>`;
const B_word=(fs)=>`<span style="font:800 ${fs}px/1 'Shippori Mincho';color:${I};letter-spacing:.01em">bDojo<span style="color:${R}">X</span></span>`;
// ---------- C: geometric wordmark built from torii parts
const C_O=(x)=>`<g transform="translate(${x} 0)"><rect x="3" y="12" width="9" height="48" fill="${R}"/><rect x="28" y="12" width="9" height="48" fill="${R}"/><rect x="-1" y="25" width="42" height="6.5" fill="${B}"/><path d="M-9-6Q20 7 49-6L44 9Q20 17-4 9Z" fill="${R}"/><rect x="-1" y="53" width="42" height="7" fill="${B}"/></g>`;
function C_word(h,uid){const sc=h/66;return `<svg height="${h}" viewBox="-12 -8 372 74" style="display:block"><g fill="${I}">
 <g transform="translate(0 -0)"><rect x="0" y="0" width="10" height="60"/><path d="M10 24H27L38 35V49L27 60H10V51H24L29 47V37L24 33H10Z"/></g>
 <g transform="translate(58 0)"><rect x="0" y="0" width="10" height="60"/><path d="M10 0H30L48 17V43L30 60H10V51H28L38 42V18L28 9H10Z"/><rect x="-9" y="25" width="19" height="6.5" fill="${B}"/></g>
 ${C_O(130)}
 <g transform="translate(196 0)"><path d="M12 0H44V9H32V46L20 60H0V51H16L22 45V9H12Z"/></g>
 ${C_O(258)}</g>
 <g transform="translate(320 0)"><path d="M0 0H12L40 60H28Z" fill="${R}"/><path d="M42 0H30L2 60H14Z" fill="${B}"/></g></svg>`}
const C_icon=(s)=>`<svg width="${s}" height="${s}" viewBox="-14 -12 68 78"><rect x="3" y="12" width="9" height="48" fill="${R}"/><rect x="28" y="12" width="9" height="48" fill="${R}"/><rect x="-1" y="25" width="42" height="6.5" fill="${B}"/><path d="M-9-6Q20 7 49-6L44 9Q20 17-4 9Z" fill="${R}"/><rect x="-1" y="53" width="42" height="7" fill="${B}"/></svg>`;
// ---------- D: kanji-led 道 with slash cut
const D_mark=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 200 200"><defs><clipPath id="dl${s}"><polygon points="0,0 118,0 74,200 0,200"/></clipPath><clipPath id="dr${s}"><polygon points="130,0 200,0 200,200 86,200"/></clipPath></defs>
<g font-family="Shippori Mincho" font-weight="800" font-size="190" text-anchor="middle"><text x="100" y="168" fill="${I}" clip-path="url(#dl${s})">道</text><text x="106" y="162" fill="${R}" clip-path="url(#dr${s})">道</text></g><polygon points="120,0 128,0 84,200 76,200" fill="${B}"/></svg>`;
const D_word=(fs)=>`<span style="font:700 ${fs}px/1 'Chakra Petch';letter-spacing:.34em;color:${I}">BDOJO<span style="color:${R}">X</span></span>`;
// ---------- E: noren banner crest
const E_mark=(h)=>`<svg height="${h}" viewBox="0 0 100 130"><defs><linearGradient id="er${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5303a"/><stop offset="1" stop-color="#a50f17"/></linearGradient></defs>
<rect x="2" y="2" width="96" height="7" rx="3.5" fill="${I}"/><circle cx="3" cy="5.5" r="4.5" fill="${I}"/><circle cx="97" cy="5.5" r="4.5" fill="${I}"/>
<path d="M8 11H92V118L84 124H68V80H65V124H35V80H32V124H16L8 118Z" fill="url(#er${h})"/>
<path d="M8 11H92M8 11V118M92 11V118" fill="none" stroke="#ffb3b6" stroke-opacity=".35"/>
<g fill="none" stroke="${I}" stroke-opacity=".5" stroke-width=".8" stroke-dasharray="2 2"><path d="M13 16H87V76"/><path d="M13 16V76"/></g>
<g transform="translate(26 24) scale(.75)"><path d="M0 8Q32 20 64 6L61 16Q32 28 3 17Z" fill="${I}"/><rect x="10" y="21" width="8" height="40" fill="${I}"/><rect x="46" y="21" width="8" height="40" fill="${I}"/><rect x="5" y="33" width="54" height="6" fill="${B}"/></g>
<text x="50" y="102" text-anchor="middle" font-family="Shippori Mincho" font-weight="800" font-size="28" fill="${I}">道場</text></svg>`;
const E_word=(fs)=>`<span style="font:800 ${fs}px/1 Syne;color:${I};letter-spacing:.01em">bDojo<span style="color:${R}">X</span></span>`;
// ---------- F: monoline torii with slash cut
const F_glyph=(w)=>`<g fill="none" stroke="${I}" stroke-width="${w}" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 12Q32 21 61 9"/><path d="M9 20Q32 27 55 19"/><path d="M15 21V60M49 21V60"/><path d="M10 34H54"/></g>`;
const F_mark=(s,w=2.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><defs><clipPath id="fa${s}"><polygon points="0,0 44,0 24,64 0,64"/></clipPath><clipPath id="fb${s}"><polygon points="50,0 64,0 64,64 30,64"/></clipPath></defs>
<g clip-path="url(#fa${s})">${F_glyph(w)}</g><g clip-path="url(#fb${s})" transform="translate(2.5 -3)">${F_glyph(w)}</g><path d="M47 -2L27 66" stroke="${R}" stroke-width="${w}"/></svg>`;
const F_word=(fs)=>`<span style="font:600 ${fs}px/1 Sora;color:${I};letter-spacing:.06em">bdojo<span style="color:${R}">x</span></span>`;

const light=(o,s)=>{const k=I;I='#0a0d16';const r=o.fav(s);I=k;return r};
const OPT=[
 {k:'A',t:'3D rendered torii',d:'three.js lacquer-red torii with brushed blue-metal nuki, rim-lit. Hero asset + simplified flat SVG for 16-48px.',
  nav:`<div class="lock">${A_img(56)}${A_word(24)}</div>`,big:A_img(380),fav:s=>A_flat(s),wf:A_word(0)},
 {k:'B',t:'Ink ensō + hanko seal',d:'Brush circle (open = the doorway), red 道 hanko stamped over it. Serif wordmark. Calligraphic, human.',
  nav:`<div class="lock">${B_mark(60)}${B_word(30)}</div>`,big:B_mark(360),fav:s=>B_fav(s)},
 {k:'C',t:'Torii-built wordmark',d:'The letters are made from torii parts: both O are gateways, D carries a nuki, J a kasagi, X is red/blue cross-cut. Custom lettering.',
  nav:C_word(34),big:C_word(110),fav:s=>C_icon(s)},
 {k:'D',t:'Kanji 道 slash-cut',d:'道 (way) as the emblem, sliced by a blue blade with the red half displaced. Persona/Sekiro title-card energy. Wide techno Latin.',
  nav:`<div class="lock">${D_mark(58)}<span style="width:1px;height:34px;background:rgba(239,236,227,.3)"></span>${D_word(20)}</div>`,big:D_mark(380),fav:s=>D_mark(s)},
 {k:'E',t:'Noren banner crest',d:'Hanging dojo curtain: rod with finials, slit panels, stitched border, torii + 道場. A badge that works as an app icon.',
  nav:`<div class="lock">${E_mark(62)}${E_word(30)}</div>`,big:E_mark(390),fav:s=>E_mark(s)},
 {k:'F',t:'Monoline torii, slash-cut',d:'One-weight line torii cut by a red slash with the right half shifted. Quiet, Linear-grade; lowercase Sora wordmark.',
  nav:`<div class="lock">${F_mark(48)}${F_word(26)}</div>`,big:F_mark(360,2),fav:s=>F_mark(s,s<24?4:2.6)},
];
document.getElementById('g').innerHTML=OPT.map(o=>`<section class="cell"><div class="tag"><b>${o.k}</b><span>${o.t}</span><i>${o.d}</i></div>
<div class="nav">${o.nav}${NAVLINKS}</div>
<div class="row"><div class="big">${o.big}</div><div class="fav"><div><small>on dark</small>${o.fav(16)}${o.fav(32)}${o.fav(64)}</div><div class="lt"><small>on light</small>${light(o,16)}${light(o,32)}${light(o,64)}</div><div><small>app tile 120</small>${o.fav(120)}</div></div></div></section>`).join('');
document.fonts.ready.then(()=>{document.title='ready';window.__ready=true});
</script>
